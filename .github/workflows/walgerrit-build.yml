name: WalGerrit build

on:
  workflow_dispatch:
  push:
    branches:
      - walgerrit-3.14
    tags:
      - walgerrit-3.14.2-*
  pull_request:
    branches:
      - walgerrit-3.14

permissions:
  contents: read

concurrency:
  group: walgerrit-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out Gerrit and pinned submodules
        uses: actions/checkout@v6
        with:
          # The WalGerrit branch is only a handful of commits above v3.14.2. Keep enough history
          # for Gerrit's version stamping without cloning the entire Gerrit project history.
          fetch-depth: 50
          fetch-tags: true
          submodules: recursive

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: plugins/walgerrit/pom.xml

      - name: Test and package WalGerrit
        working-directory: plugins/walgerrit
        run: ./mvnw --batch-mode --no-transfer-progress verify

      - name: Build Gerrit 3.14.2 release WAR
        run: npx --yes @bazel/bazelisk build --config=java21 //:release

      - name: Assemble Gerrit PoC payload
        env:
          SOURCE_COMMIT: ${{ github.sha }}
        run: |
          mkdir -p dist
          cp bazel-bin/release.war dist/gerrit.war
          cp plugins/walgerrit/target/walgerrit-0.1.0-SNAPSHOT.jar dist/walgerrit.jar
          cp plugins/walgerrit/docs/artifact-bundle.md dist/INSTALL.md
          cp plugins/walgerrit/packaging/criteo-images.Dockerfile.fragment \
            dist/criteo-images.Dockerfile.fragment
          printf '%s\n' "$SOURCE_COMMIT" > dist/SOURCE_COMMIT
          printf '%s\n' '3.14.2' > dist/GERRIT_VERSION
          sha256sum dist/gerrit.war dist/walgerrit.jar \
            | sed 's#dist/##' > dist/SHA256SUMS
          tar -C dist -czf dist/walgerrit-gerritpoc-bundle.tar.gz \
            gerrit.war walgerrit.jar INSTALL.md criteo-images.Dockerfile.fragment \
            SOURCE_COMMIT GERRIT_VERSION SHA256SUMS

      - name: Exercise the exact Gerrit PoC payload
        env:
          GERRIT_WAR: ${{ github.workspace }}/dist/gerrit.war
          WALGERRIT_JAR: ${{ github.workspace }}/dist/walgerrit.jar
        run: plugins/walgerrit/scripts/smoke-test.sh

      - name: Upload deployment bundle
        uses: actions/upload-artifact@v7
        with:
          name: walgerrit-3.14.2-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 30

  publish-release:
    if: startsWith(github.ref, 'refs/tags/walgerrit-3.14.2-')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download tested deployment bundle
        uses: actions/download-artifact@v8
        with:
          name: walgerrit-3.14.2-${{ github.sha }}
          path: dist

      - name: Verify release payload
        env:
          SOURCE_COMMIT: ${{ github.sha }}
        run: |
          test "$(cat dist/SOURCE_COMMIT)" = "$SOURCE_COMMIT"
          cd dist
          sha256sum --check SHA256SUMS

      - name: Publish immutable GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" \
            dist/gerrit.war \
            dist/walgerrit.jar \
            dist/SHA256SUMS \
            dist/SOURCE_COMMIT \
            dist/GERRIT_VERSION \
            dist/INSTALL.md \
            dist/walgerrit-gerritpoc-bundle.tar.gz \
            --verify-tag \
            --prerelease \
            --title "WalGerrit 3.14.2 PoC ${RELEASE_TAG}" \
            --notes "Tested Gerrit PoC payload built from ${GITHUB_SHA}. The WAR and WalGerrit library must be consumed together; verify them with SHA256SUMS."
