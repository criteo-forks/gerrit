syntax = "proto3";

package walgerrit.v1;

option java_package = "dev.walgerrit.proto";
option java_outer_classname = "StorageProto";

// The mutable repository index. Its atomic replacement is the only point at
// which a transaction becomes visible.
message Manifest {
  uint32 format_version = 1;
  // The repository id: the key everything of this repository is stored under.
  // Names live in the catalog repository, never here.
  string repo = 2;
  string object_format = 3;
  uint64 head_seq = 4;
  repeated PackRef packs = 5;
  uint64 revision = 7;
  int64 updated_at_epoch_millis = 8;
  string writer = 9;
  // Changes only when the live reftable stack changes. Object-pack appends
  // deliberately do not invalidate a ref transaction based on this value.
  uint64 ref_revision = 10;
  // transaction_id of the entry at head_seq; empty while head_seq is 0. Log
  // entries form a chain, each naming the transaction id of the entry before
  // it, so a follower walks back from here with deterministic keys,
  // log/<seq>-<transaction_id>.pb, and the manifest needs no table of entries.
  string head_transaction_id = 12;
  // Advances only when the repository is fenced for a namespace operation. A
  // publication carries the epoch its writer was admitted under and is refused
  // when this differs, so a deletion stops every writer admitted before it,
  // on every node, at the commit point.
  uint64 write_epoch = 13;
  // The namespace operation whose fence last advanced write_epoch; lets a
  // repeated fence recognise its own work.
  string fence_operation = 14;
  // Terminal: set by the fence of a deletion. Nothing is published afterwards.
  bool deleted = 15;
  // Complete only at this exact ref_revision. A writer predating this field
  // cannot silently keep the directory current after it changes refs.
  ChangeKeys change_keys = 16;
}

// Each pointer identifies an immutable page in the committed WAL. An absent
// page in a complete directory means every key in that page is absent.
message ChangeKeys {
  uint64 ref_revision = 1;
  map<uint32, LogPosition> pages = 2;
}

message ChangeMembers { repeated int32 numbers = 1; }
message ChangeKeyPage { map<string, ChangeMembers> keys = 1; }
message ChangeKeyCheck { string key = 1; ChangeMembers expected = 2; }
message ChangeKeyMutation { string before = 1; string after = 2; }

message PackRef {
  // JGit's stable DFS pack name. Pack and index data beneath wal/ are
  // immutable once this record is published.
  string name = 1;
  string source = 2;
  uint64 seq = 3;
  int64 last_modified_epoch_millis = 4;
  uint64 object_count = 5;
  uint64 delta_count = 6;
  uint64 min_update_index = 7;
  uint64 max_update_index = 8;
  repeated PackFile files = 9;
  string pack_checksum = 10;
}

message PackFile {
  string extension = 1;
  uint64 size = 2;
  uint32 block_size = 3;
}

// One immutable log object, log/<seq>-<transaction_id>.pb.
message LogEntry {
  enum Kind {
    KIND_UNSPECIFIED = 0;
    PACK = 1;
    REF_UPDATE = 2;
    COMPACT = 3;
    // Gerrit events fired on the writing node, carried as JSON for every other
    // node to deliver to its own stream-events subscribers and plugins. May
    // also carry index_update.
    EVENT = 4;
    // Documents the writing node reindexed without a ref update behind them,
    // for every other node to reindex in its own index.
    INDEX = 5;
    // A namespace operation's fence: no files, no refs; advances write_epoch.
    FENCE = 6;
  }

  uint64 seq = 1;
  Kind kind = 2;
  repeated PackRef additions = 3;
  repeated string supersedes = 4;
  int64 created_at_epoch_millis = 5;
  string writer = 6;
  uint64 base_revision = 7;
  // Present for REF_UPDATE. This is the logical transaction whose reftable
  // publication became durable at this sequence. Secondary-index followers
  // replay it from the WAL; it is deliberately recorded before the manifest
  // CAS so an acknowledged ref update can never lose its index event.
  RefTransaction ref_transaction = 8;
  // Unique per publication attempt; only the CAS winner's id is referenced by
  // the manifest. Followers keep it in their cursor to detect a manifest that
  // was rolled back to an older version and then diverged.
  string transaction_id = 9;
  // transaction_id of the entry at seq - 1; empty for the first entry. Only
  // entries reachable from the manifest's head through this chain are history;
  // an entry written by a publication that lost its CAS is never referenced.
  string previous_transaction_id = 10;
  // Present for EVENT: the Gerrit events, one JSON document each, in the order
  // they were fired. Replayed by every node whose writer host differs.
  repeated string event_json = 11;
  // Present for INDEX, and for an EVENT entry whose batch also reindexed
  // documents. Replayed by every node whose writer host differs.
  IndexUpdate index_update = 12;
  // Present for FENCE: the namespace operation that fenced the repository.
  string fence_operation = 13;
  // A random id the writing process drew when it started. Unlike `writer`
  // (host:pid) it is never repeated by a restart, so a node can tell the
  // entries of the process it is from those of a process that ended. Empty
  // on entries written before this field existed: no running process's.
  string writer_process = 14;
  map<uint32, ChangeKeyPage> change_key_pages = 15;
}

// Documents one node reindexed with no ref update behind them: an explicit
// reindex, a mergeability recomputation. Ref-driven index work needs no
// journal; every node derives it from REF_UPDATE entries. Changes are numbers
// of the entry's repository; accounts and groups are journaled in All-Users,
// projects in All-Projects.
message IndexUpdate {
  repeated int32 changes = 1;
  repeated int32 accounts = 2;
  repeated string groups = 3;
  repeated string projects = 4;
}

message RefUpdate {
  string name = 1;
  // Full hexadecimal object IDs. The all-zero ID means the ref did not exist.
  string old_object_id = 2;
  string new_object_id = 3;
  // Set when the new value is symbolic (for example HEAD -> refs/heads/main).
  string new_symbolic_target = 4;
  // Present on a classified change meta update, empty when membership is unchanged.
  ChangeKeyMutation change_key = 5;
}

message RefTransaction {
  repeated RefUpdate updates = 1;
  // A node publishes the ref transactions that wait together as one entry.
  // How many of `updates`, in order, each of them made. Empty on entries
  // written before this field existed: their updates cannot be told apart, so
  // nothing can be concluded from two of them being in one entry.
  repeated uint32 members = 2;
  repeated ChangeKeyCheck change_key_checks = 3;
}

// Node-local acknowledgement of secondary-index replay. It is stored beside
// that node's Lucene indexes, never in the shared object store.
message IndexCursor {
  uint64 sequence = 1;
  // transaction_id of the entry at sequence; empty at sequence 0.
  string transaction_id = 2;
  // Object-store version (the ETag) of the manifest whose head this cursor
  // reached, when the cursor is at that head; empty when unknown. A listing
  // that reports the same version means nothing was published since, so a
  // restarted node need not read the manifest to know it is caught up.
  string manifest_version = 3;
  // Changes that ref transactions of this node merged and whose change-merged
  // event the log does not hold yet; replaced together with the cursor.
  repeated OwedMerge owed = 4;
  // Set when the cursor was moved over entries that were not read, by an
  // index rebuild or an offline reindex: the entry up to which merges were
  // recorded in `owed`. The next replay reads the entries between it and the
  // cursor for merges and their events only, and clears it.
  LogPosition merges_read_to = 5;
  // Changes of other repositories that entries up to the cursor named while
  // this node's change index did not hold them, and that it has not indexed
  // since; replaced together with the cursor. See docs/index-events.md.
  repeated int32 unindexed = 6;
}

// The entry at `sequence`, named as a cursor names it.
message LogPosition {
  uint64 sequence = 1;
  string transaction_id = 2;
}

// A change that a ref transaction of this node merged, with what its
// change-merged event says. Recorded when the node's replay passes the
// transaction and removed when it passes the log entry that carries the
// event. See docs/events.md.
message OwedMerge {
  int32 change = 1;
  int32 patch_set = 2;
  // The change's meta ref after the transaction: the NoteDb state the event
  // describes.
  string meta_revision = 3;
  // What the ref transaction that merged the change made the change's
  // destination branch; empty when it did not update that branch, or when the
  // entry does not say which of its updates that transaction made. Such a
  // merge is not known to be a submit's and its event cannot be rebuilt.
  string new_revision = 4;
  int32 submitter = 5;
  int64 merged_at_epoch_millis = 6;
  // Sequence of the transaction's log entry.
  uint64 sequence = 7;
  // writer_process of the process that is to fire the event: the one that
  // wrote the transaction, or the one that fired the event again since.
  string process = 8;
  // The commit of the patch set that was merged.
  string patch_set_revision = 9;
}

// A reader's acknowledgement of one repository's log, shared by every node:
// cluster/event-log/<reader>/cursors/<repo-id>. Only the reader holding the
// lease of that name moves it, by a compare-and-swap on its version, so a
// holder that lost the lease without noticing cannot move it back. See
// EventLog.
message LogCursor {
  uint64 sequence = 1;
  // transaction_id of the entry at sequence; empty at sequence 0.
  string transaction_id = 2;
  // Version of the manifest whose head the cursor reached, when it is at
  // that head; empty otherwise. A listing that reports the same version means
  // nothing was published since.
  string head_version = 3;
}

// Stored at leases/<repo-id>/compaction. Holding it only avoids duplicate
// work: the manifest CAS, with its check that every superseded pack is still
// live, is what keeps two compactors from corrupting anything. A lease whose
// expiry has passed, including a released one (expiry 0), may be taken over.
message CompactionLease {
  string owner = 1;
  int64 expires_at_epoch_millis = 2;
  // Unique to one acquisition, even when the same process takes the lease again.
  string acquisition_id = 3;
}

// Sidecar <name>.chunks beside a cached pack that is being fetched in
// chunks: which chunks of the sparse local file hold store bytes. The
// sidecar's absence is what marks a cached file complete.
message PartialFile {
  uint64 size = 1;
  uint32 chunk_size = 2;
  // A java.util.BitSet of present chunks, little-endian as BitSet writes it.
  bytes present = 3;
}

// Best-effort UDP notification after a manifest publication. Receivers use it
// to trigger conditional reads and index replay for one repository. Periodic
// reads and sweeps discover writes whose notifications were lost.
message GossipHint {
  // The repository id.
  string repo = 1;
  // The store's version token for the manifest the sender wrote; on S3, its
  // ETag. Compared for equality only, like a listed version.
  string manifest_version = 2;
  uint64 revision = 3;
  uint64 head_seq = 4;
  string head_transaction_id = 5;
  // Sender identity; receivers ignore hints from their own host.
  string writer = 6;
  int64 sent_at_epoch_millis = 7;
}
