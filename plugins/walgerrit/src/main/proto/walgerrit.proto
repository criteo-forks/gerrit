syntax = "proto3";

package walgerrit.v1;

option java_package = "dev.walgerrit.proto";
option java_outer_classname = "StorageProto";

// The mutable repository index. Its atomic replacement is the only point at
// which a transaction becomes visible.
message Manifest {
  uint32 format_version = 1;
  string repo = 2;
  string object_format = 3;
  uint64 head_seq = 4;
  repeated PackRef packs = 5;
  // Log segments covering [min_seq, head_seq]: ascending, contiguous and
  // non-overlapping. Bounded by folding: runs of single-entry segments are
  // merged, and segments older than the retention rule drop below min_seq.
  repeated LogRef log_segments = 6;
  uint64 revision = 7;
  int64 updated_at_epoch_millis = 8;
  string writer = 9;
  // Changes only when the live reftable stack changes. Object-pack appends
  // deliberately do not invalidate a ref transaction based on this value.
  uint64 ref_revision = 10;
  // Sequence of the oldest entry the manifest still references; 0 means every
  // entry since creation. Entries below it were folded away from the manifest
  // by retention. Their objects stay in the store, but a follower whose cursor
  // is below this floor rebuilds its derived state instead of replaying.
  uint64 min_seq = 11;
}

message PackRef {
  // JGit's stable DFS pack name. Pack and index data beneath wal/ are
  // immutable once this record is published.
  string name = 1;
  string source = 2;
  uint64 seq = 3;
  int64 last_modified_epoch_millis = 4;
  uint64 object_count = 5;
  uint64 delta_count = 6;
  uint64 min_update_index = 7;
  uint64 max_update_index = 8;
  repeated PackFile files = 9;
  string pack_checksum = 10;
}

message PackFile {
  string extension = 1;
  uint64 size = 2;
  uint32 block_size = 3;
}

// One immutable log object holding the entries [first_seq, last_seq].
message LogRef {
  string key = 1;
  uint64 first_seq = 2;
  uint64 last_seq = 3;
  uint64 size = 4;
  bool sealed = 5;
  // transaction_id of the entry at last_seq, so a follower whose cursor sits
  // on a segment boundary can validate it without reading the segment.
  string last_transaction_id = 6;
  // created_at of the entry at last_seq; drives time-based retention.
  int64 last_created_at_epoch_millis = 7;
}

message LogEntry {
  enum Kind {
    KIND_UNSPECIFIED = 0;
    PACK = 1;
    REF_UPDATE = 2;
    COMPACT = 3;
  }

  uint64 seq = 1;
  Kind kind = 2;
  repeated PackRef additions = 3;
  repeated string supersedes = 4;
  int64 created_at_epoch_millis = 5;
  string writer = 6;
  uint64 base_revision = 7;
  // Present for REF_UPDATE. This is the logical transaction whose reftable
  // publication became durable at this sequence. Secondary-index followers
  // replay it from the WAL; it is deliberately recorded before the manifest
  // CAS so an acknowledged ref update can never lose its index event.
  RefTransaction ref_transaction = 8;
  // Unique per publication attempt; only the CAS winner's id is referenced by
  // the manifest. Followers keep it in their cursor to detect a manifest that
  // was rolled back to an older version and then diverged.
  string transaction_id = 9;
}

// Every log object is one segment: a single entry when published, several
// consecutive entries after folding.
message LogSegment {
  repeated LogEntry entries = 1;
}

message RefUpdate {
  string name = 1;
  // Full hexadecimal object IDs. The all-zero ID means the ref did not exist.
  string old_object_id = 2;
  string new_object_id = 3;
  // Set when the new value is symbolic (for example HEAD -> refs/heads/main).
  string new_symbolic_target = 4;
}

message RefTransaction {
  repeated RefUpdate updates = 1;
}

// Node-local acknowledgement of secondary-index replay. It is stored beside
// that node's Lucene indexes, never in the shared object store.
message IndexCursor {
  uint64 sequence = 1;
  // transaction_id of the entry at sequence; empty at sequence 0.
  string transaction_id = 2;
}

// Stored at leases/<repo>.git/compaction. Holding it only avoids duplicate
// work: the manifest CAS, with its check that every superseded pack is still
// live, is what keeps two compactors from corrupting anything. A lease whose
// expiry has passed, including a released one (expiry 0), may be taken over.
message CompactionLease {
  string owner = 1;
  int64 expires_at_epoch_millis = 2;
}
